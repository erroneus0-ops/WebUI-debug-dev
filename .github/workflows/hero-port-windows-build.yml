# .github/workflows/hero-port-windows-build.yml
#
# WHAT THIS DOES
# ---------------
# Builds a portable, standalone Windows toolchain for ugBASIC's coco
# target -- ugbc.coco.exe, asm6809.exe, decb.exe -- on a real GitHub-
# hosted Windows runner, and publishes the result as a GitHub Release
# asset (a zip you can download and unzip on any Windows machine, no
# WSL, no MSYS2 install, no dev environment setup required on the
# machine that actually uses it).
#
# WHY MSYS2/MINGW64
# -------------------
# ugBASIC's own build system (Makefiles, autotools for the asm6809
# submodule) assumes a POSIX-like environment -- it doesn't work with
# plain MSVC/cl.exe. MSYS2 provides that POSIX layer on Windows, and
# specifically targeting its MINGW64 subsystem (rather than the base
# MSYS environment) produces genuinely native Windows .exe files whose
# only runtime dependencies are a handful of common MinGW runtime DLLs
# (bundled alongside in the output zip) -- not something that requires
# MSYS2 itself to be installed on the machine that runs it.
#
# WHY A RELEASE, NOT A WORKFLOW ARTIFACT
# -----------------------------------------
# Same reasoning as the Linux CI workflow in this same repo: workflow
# artifacts live on a GitHub domain that isn't reachable from outside
# a browser session; Release assets are served from
# release-assets.githubusercontent.com, which is reachable more
# broadly (and is just a normal clickable download link for a human
# anyway).

name: Build Windows toolchain (ugBASIC coco, MSYS2/MinGW64)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/hero-port-windows-build.yml'
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            zip
            unzip
            autoconf
            automake
            libtool
            bison
            flex
            vim
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libtool

      - name: Check out ugBASIC (+ only the submodules the coco toolchain needs)
        run: |
          git clone --depth 1 https://github.com/spotlessmind1975/ugbasic.git /tmp/ugbasic-win
          cd /tmp/ugbasic-win
          git submodule update --init --depth 1 modules/asm6809 modules/toolshed modules/libxml2
          # libxml2 is needed unconditionally by ugbc's own `compiler`
          # build target, regardless of platform target -- the exact
          # same gap found and fixed for the Linux CI workflow earlier
          # in this project, just forgotten when writing this Windows
          # workflow from scratch. Confirmed via a real CI run:
          # "./autogen.sh: No such file or directory" trying to build
          # ../modules/libxml2/.libs/libxml2.a, because that submodule
          # was never checked out at all.
          # Real MinGW compat bug found via an actual CI run: toolshed's
          # libnativemakdir.c checks #ifdef WIN32 (defined by MinGW64,
          # confirmed) and calls _mkdir() in that branch, but never
          # includes <direct.h> -- the actual MinGW/MSVC header that
          # declares it. Modern GCC treats implicit function declarations
          # as hard errors by default, so this fails to compile rather
          # than just warning. See hero-port/patches/toolshed-mingw-
          # mkdir.patch for the full explanation; verified to apply
          # cleanly against a fresh toolshed clone before this workflow
          # ever ran it for real.
          (cd modules/toolshed && git apply "${GITHUB_WORKSPACE}/hero-port/patches/toolshed-mingw-mkdir.patch")

      - name: Build asm6809
        run: |
          cd /tmp/ugbasic-win
          make target=coco asm6809
          # (vim, added above, provides xxd -- ugbc's own build needs it
          # to generate src-generated/6809_bits_to_string.c. Confirmed
          # via a real CI run: GitHub's ubuntu-latest runners happen to
          # have xxd preinstalled already, which is why the Linux CI
          # workflow never needed to add it explicitly, but MSYS2 does
          # not include it by default.)

      - name: Build only the toolshed pieces decb actually needs
        run: |
          # ugBASIC's own `make target=coco toolchain` rule triggers
          # toolshed's *entire* `make install`, which builds ar2, os9,
          # mamou, decb, tocgen, cocofuse, makewav, cecb, and its docs --
          # confirmed by reading modules/toolshed/build/unix/Makefile's
          # own DIRS list directly. We only ever need decb (confirmed via
          # its actual link line: -ltoolshed -lcoco -lnative -lcecb -lrbf
          # -ldecb -lmisc -lsys, no dependency on any of the other tools).
          # On Windows this matters, not just for build time: cecb
          # specifically fails to link under MinGW (undefined references
          # to readdir64/__errno_location -- glibc-specific symbol names
          # toolshed's own code calls directly rather than through the
          # portable readdir()/errno mechanisms MinGW provides instead).
          # decb itself never needed those functions in the first place,
          # so building only what decb actually requires sidesteps the
          # problem entirely rather than needing to patch toolshed's
          # source for MinGW compatibility.
          cd /tmp/ugbasic-win/modules/toolshed/build/unix
          for dir in libtoolshed libnative libcecb librbf libcoco libdecb libmisc libsys decb; do
            echo "=== building $dir ==="
            (cd "$dir" && make)
          done
          ls -la decb/decb*

      - name: Build ugbc.coco
        run: |
          cd /tmp/ugbasic-win
          make target=coco compiler
          ls -la ugbc/exe/

      - name: Confirm the build actually works
        run: |
          cd /tmp/ugbasic-win
          ./ugbc/exe/ugbc.coco -V
          # Real smoke test, not just "the binary exists": compile a
          # trivial program all the way through to a .dsk, using the
          # asm6809 built in this same job (not the -C/-b path-finding
          # workaround the Linux CI needed -- confirm first whether
          # this Windows build needs the same explicit flags).
          cat > /tmp/smoketest.bas << 'EOF'
          PMODE 4, 1
          CLS
          DO
          LOOP
          EOF
          ./ugbc/exe/ugbc.coco -W -o /tmp/smoketest.dsk -O dsk /tmp/smoketest.bas
          ls -la /tmp/smoketest.dsk

      - name: Package the toolchain + required runtime DLLs
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build-output/win-toolchain"
          cp /tmp/ugbasic-win/ugbc/exe/ugbc.coco* "${GITHUB_WORKSPACE}/build-output/win-toolchain/" 2>/dev/null || true
          cp /tmp/ugbasic-win/modules/asm6809/src/asm6809* "${GITHUB_WORKSPACE}/build-output/win-toolchain/" 2>/dev/null || true
          # decb is grabbed straight from its own build directory now,
          # not from an "installed" location -- we deliberately never run
          # toolshed's own `make install` (see the previous step for why).
          find /tmp/ugbasic-win/modules/toolshed/build/unix/decb -maxdepth 1 -iname "decb*" -type f -exec cp {} "${GITHUB_WORKSPACE}/build-output/win-toolchain/" \; 2>/dev/null || true
          # Bundle whatever MinGW runtime DLLs the built .exe(s) actually
          # depend on, so this is genuinely standalone -- not yet fully
          # verified which specific DLLs are needed; ldd's output here
          # drives what actually gets copied, rather than guessing a
          # fixed list up front.
          for exe in "${GITHUB_WORKSPACE}/build-output/win-toolchain"/*.exe; do
            [ -e "$exe" ] || continue
            ldd "$exe" | grep -i mingw | awk '{print $3}' | while read -r dll; do
              [ -e "$dll" ] && cp -n "$dll" "${GITHUB_WORKSPACE}/build-output/win-toolchain/"
            done
          done
          ls -la "${GITHUB_WORKSPACE}/build-output/win-toolchain/"
          cat > "${GITHUB_WORKSPACE}/build-output/win-toolchain/README.txt" << 'EOF'
          ugBASIC coco toolchain -- portable Windows build

          Usage (explicit -C/-b needed -- ugbc.coco's default auto-discovery of
          asm6809/decb relies on a relative-path convention that only applies
          when running from inside a full ugBASIC source checkout, not this
          flat, standalone folder):

            ugbc.coco.exe -W -C asm6809.exe -b decb.exe -o output.dsk -O dsk source.bas

          See hero-port/upstream-reports/ in erroneus0-ops/WebUI-debug-dev for a
          running list of known compiler bugs/quirks to watch for, and
          hero-port/WINDOWS-BUILD.md for the full build workflow this came from.
          EOF
          cd "${GITHUB_WORKSPACE}/build-output/win-toolchain"
          zip -r "${GITHUB_WORKSPACE}/build-output/ugbasic-coco-windows.zip" .

      - name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ugbasic-windows-${{ github.run_number }}
          name: "ugBASIC coco Windows toolchain build #${{ github.run_number }}"
          body: |
            Portable Windows build of ugBASIC's coco toolchain (ugbc.coco.exe,
            asm6809.exe, decb.exe), built from spotlessmind1975/ugbasic main
            branch at the commit checked out during this run. Unzip and use
            directly -- no MSYS2/WSL install needed on the machine that runs it
            (this first version of the workflow hasn't yet had its DLL bundling
            fully verified against a real, separate Windows machine -- treat
            this initial release as provisional until confirmed).
          files: |
            build-output/ugbasic-coco-windows.zip
          prerelease: true
