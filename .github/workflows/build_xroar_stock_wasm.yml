name: Build XRoar WASM (stock, pure upstream)

# Trigger manually from GitHub Actions tab
# or automatically when the pristine xroar-1.12.1 source or this workflow changes
on:
  workflow_dispatch:
  push:
    paths:
      - 'xroar-1.12.1/**'
      - '.github/workflows/build_xroar_stock_wasm.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Verify emcc
        run: emcc --version

      - name: Install autotools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool

      - name: Generate configure script (if needed)
        run: |
          cd xroar-1.12.1
          if [ -f configure ]; then
            echo "configure already present in this release tarball -- skipping autogen.sh"
            echo "Fixing timestamps so autotools doesn't think pre-generated files are stale"
            echo "(git checkout gives every file the same timestamp, which breaks autotools'"
            echo "timestamp-based staleness detection -- the files are fine, just need"
            echo "correct relative ordering: sources older than the generated files)"
            find . \( -name "*.m4" -o -name "configure.ac" -o -name "Makefile.am" -o -name "acinclude.m4" \) -exec touch -t 202001010000 {} +
            sleep 1
            touch aclocal.m4 configure config.h.in
            find . -name "Makefile.in" -exec touch {} +
          elif [ -f autogen.sh ]; then
            bash autogen.sh
          else
            echo "Neither configure nor autogen.sh found!"
            exit 1
          fi

      - name: Configure for WASM
        run: |
          cd xroar-1.12.1
          chmod +x configure config.guess config.sub install-sh missing compile ar-lib depcomp 2>/dev/null || true
          emconfigure ./configure --enable-wasm CFLAGS="-O3 -flto" LDFLAGS="-O3 -flto"

      - name: Build standalone version reporter (tiny, separate from xroar itself)
        run: |
          emcc wasm/xroar_version_report.c -I xroar-1.12.1 -o wasm/xroar-version.js \
            -s EXPORTED_FUNCTIONS='["_xroar_version_report_get_version","_malloc"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap","UTF8ToString"]' \
            -s MODULARIZE=1 -s EXPORT_NAME="XRoarVersionReportModule" \
            -s ENVIRONMENT=web \
            -O2
          ls -la wasm/xroar-version.js wasm/xroar-version.wasm
          echo "=== version string this reports ==="
          grep -o 'PACKAGE_TEXT[^,]*' xroar-1.12.1/config.h || true

      - name: Build XRoar WASM
        id: build
        run: |
          cd xroar-1.12.1
          set +e
          emmake make 2>&1 | tee /tmp/build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          echo "build_status=$BUILD_STATUS" >> "$GITHUB_OUTPUT"
          exit "$BUILD_STATUS"
        shell: bash

      - name: Save build log on failure
        if: failure() && steps.build.outcome == 'failure'
        run: |
          mkdir -p wasm
          echo "# Build failure log (tail -300)" > wasm/XROAR_STOCK_BUILD_ERROR.log
          tail -300 /tmp/build.log >> wasm/XROAR_STOCK_BUILD_ERROR.log
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add wasm/XROAR_STOCK_BUILD_ERROR.log
          git commit -m "ci: save xroar stock build failure log [ci skip]" || true
          git pull --rebase --autostash origin main || true
          git push || true
          echo "Build failed -- log saved to wasm/XROAR_STOCK_BUILD_ERROR.log and pushed"

      - name: Locate build output
        run: |
          find xroar-1.12.1/src -maxdepth 1 -name "xroar.js" -o -name "xroar.wasm" 2>/dev/null

      - name: Replace live xroar.js/xroar.wasm (and the index_custom.html copies)
        run: |
          cp xroar-1.12.1/src/xroar.js   wasm/xroar.js
          cp xroar-1.12.1/src/xroar.wasm wasm/xroar.wasm
          # index_custom.html references xroar-custom-patched.js specifically --
          # stock build for now (per CUSTOM_DEBUG_FUNCTIONS_EXTRACTED.md, nothing
          # in the UI actually calls the custom debug-register functions yet, so
          # there's no functional loss in using the stock build here too). Fixes
          # a real broken link: the previous xroar-custom-patched.js had no
          # matching .wasm file at all.
          cp xroar-1.12.1/src/xroar.js   wasm/xroar-custom-patched.js
          cp xroar-1.12.1/src/xroar.wasm wasm/xroar-custom-patched.wasm

      - name: Verify output
        run: |
          ls -la wasm/xroar.js wasm/xroar.wasm wasm/xroar-custom-patched.js wasm/xroar-custom-patched.wasm
          test -s wasm/xroar.wasm && echo "xroar.wasm OK"
          test -s wasm/xroar.js   && echo "xroar.js OK"
          test -s wasm/xroar-custom-patched.wasm && echo "xroar-custom-patched.wasm OK"
          test -s wasm/xroar-custom-patched.js   && echo "xroar-custom-patched.js OK"

      - name: Write build report
        if: always()
        run: |
          echo "# XRoar stock WASM Build Report" > wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "**Built:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "**Source:** xroar-1.12.1/ (pure upstream, unmodified -- https://www.6809.org.uk/xroar/dl/xroar-1.12.1.tar.gz)" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "**Build flags:** CFLAGS/LDFLAGS = -O3 -flto (per Ciaran's own XRoar Online build recommendation)" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "**WASM size:** $(wc -c < wasm/xroar.wasm 2>/dev/null || echo 'build failed') bytes" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "This replaces the live wasm/xroar.js and wasm/xroar.wasm used by" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "index.html and index_new.html, AND wasm/xroar-custom-patched.js /" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo ".wasm used by index_custom.html. Pure upstream, no custom" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "modifications -- the custom debug-register functions (wasm_get_pc" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "etc.) are not part of this build. Nothing in the UI calls them yet," >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "so using stock here too costs nothing functionally. Extracted and" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "documented in CUSTOM_DEBUG_FUNCTIONS_EXTRACTED.md for a future" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "rebase, if that work is picked back up." >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "Also built: wasm/xroar-version.js / xroar-version.wasm -- a tiny," >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "separate, MODULARIZE-d companion program (not part of xroar's own" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "source) that reports the version string from the same config.h" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "this build generated. Exists so the page can query the version at" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "runtime without touching xroar.wasm itself at all." >> wasm/XROAR_STOCK_BUILD_REPORT.md

      - name: Commit WASM output
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          echo "=== git status before add ==="
          git status --short | head -30

          git add wasm/xroar.js wasm/xroar.wasm wasm/xroar-custom-patched.js wasm/xroar-custom-patched.wasm wasm/xroar-version.js wasm/xroar-version.wasm wasm/XROAR_STOCK_BUILD_REPORT.md

          if git diff --staged --quiet; then
            echo "Nothing staged -- output identical to what's already committed. Skipping commit/push."
            exit 0
          fi

          git commit -m "build: xroar stock WASM from pure 1.12.1 upstream [ci skip]"

          echo "=== attempting git pull --rebase --autostash origin main ==="
          if ! git pull --rebase --autostash origin main; then
            echo "PULL --REBASE FAILED. git status follows:"
            git status
            git rebase --abort 2>/dev/null || true
            exit 1
          fi

          echo "=== attempting git push ==="
          if ! git push; then
            echo "PUSH FAILED. git status and remote follow:"
            git status
            git remote -v
            exit 1
          fi

          echo "Push succeeded."
