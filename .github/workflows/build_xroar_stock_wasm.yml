name: Build XRoar WASM (stock, pure upstream)

# Trigger manually from GitHub Actions tab
# or automatically when the pristine emcc_workflow/xroar-1.12.1-pristine source or this workflow changes
#
# Builds ONLY from emcc_workflow/xroar-1.12.1-pristine/ -- a genuinely
# untouched copy of upstream, refreshed manually (by Daniel, deliberately,
# git-committed as its own visible event) only when a real new release
# drops, never fetched fresh inside CI. Feeds xroar.js/.wasm, used by
# index.html and index_new.html.
#
# This workflow used to ALSO copy its own output to
# wasm/xroar-custom-patched.js/.wasm (a stopgap from before the custom
# debugger work existed for real, when nothing in the UI called any
# custom function yet, so using a stock copy there cost nothing). That's
# no longer true -- see build_xroar_wasm.yml, which now builds the
# actually-patched emcc_workflow/xroar-1.12.1/ tree into that exact
# filename instead. This workflow no longer touches
# xroar-custom-patched.* at all.
on:
  workflow_dispatch:
  push:
    paths:
      - 'emcc_workflow/xroar-1.12.1-pristine/**'
      - '.github/workflows/build_xroar_stock_wasm.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Verify emcc
        run: emcc --version

      - name: Install autotools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool

      - name: Generate configure script (if needed)
        run: |
          cd emcc_workflow/xroar-1.12.1-pristine
          if [ -f configure ]; then
            echo "configure already present in this release tarball -- skipping autogen.sh"
            echo "Fixing timestamps so autotools doesn't think pre-generated files are stale"
            echo "(git checkout gives every file the same timestamp, which breaks autotools'"
            echo "timestamp-based staleness detection -- the files are fine, just need"
            echo "correct relative ordering: sources older than the generated files)"
            find . \( -name "*.m4" -o -name "configure.ac" -o -name "Makefile.am" -o -name "acinclude.m4" \) -exec touch -t 202001010000 {} +
            sleep 1
            touch aclocal.m4 configure config.h.in
            find . -name "Makefile.in" -exec touch {} +
          elif [ -f autogen.sh ]; then
            bash autogen.sh
          else
            echo "Neither configure nor autogen.sh found!"
            exit 1
          fi

      - name: Configure for WASM
        run: |
          cd emcc_workflow/xroar-1.12.1-pristine
          chmod +x configure config.guess config.sub install-sh missing compile ar-lib depcomp 2>/dev/null || true
          emconfigure ./configure --enable-wasm CFLAGS="-O3 -flto" LDFLAGS="-O3 -flto"

      - name: Build standalone version reporter (plain -- this is the stock build)
        run: |
          # No -DXROAR_BUILD_TAG here -- reports the bare "XRoar 1.12.1",
          # accurately, because this really is unmodified upstream. The
          # tagged variant (build_xroar_wasm.yml, "+debug-exports") is
          # built separately, from the patched tree, to a different
          # output filename.
          emcc wasm/xroar_version_report.c -I emcc_workflow/xroar-1.12.1-pristine -o wasm/xroar-version.js \
            -s EXPORTED_FUNCTIONS='["_xroar_version_report_get_version","_malloc"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap","UTF8ToString"]' \
            -s MODULARIZE=1 -s EXPORT_NAME="XRoarVersionReportModule" \
            -s ENVIRONMENT=web \
            -O2
          ls -la wasm/xroar-version.js wasm/xroar-version.wasm
          echo "=== version string this reports ==="
          grep -o 'PACKAGE_TEXT[^,]*' emcc_workflow/xroar-1.12.1-pristine/config.h || true

      - name: Build XRoar WASM
        id: build
        run: |
          cd emcc_workflow/xroar-1.12.1-pristine
          set +e
          emmake make 2>&1 | tee /tmp/build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          echo "build_status=$BUILD_STATUS" >> "$GITHUB_OUTPUT"
          exit "$BUILD_STATUS"
        shell: bash

      - name: Save build log on failure
        if: failure() && steps.build.outcome == 'failure'
        run: |
          mkdir -p wasm
          echo "# Build failure log (tail -300)" > wasm/XROAR_STOCK_BUILD_ERROR.log
          tail -300 /tmp/build.log >> wasm/XROAR_STOCK_BUILD_ERROR.log
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add wasm/XROAR_STOCK_BUILD_ERROR.log
          git commit -m "ci: save xroar stock build failure log [ci skip]" || true
          git pull --rebase --autostash origin main || true
          git push || true
          echo "Build failed -- log saved to wasm/XROAR_STOCK_BUILD_ERROR.log and pushed"

      - name: Locate build output
        run: |
          find emcc_workflow/xroar-1.12.1-pristine/src -maxdepth 1 -name "xroar.js" -o -name "xroar.wasm" 2>/dev/null

      - name: Replace live xroar.js/xroar.wasm
        run: |
          cp emcc_workflow/xroar-1.12.1-pristine/src/xroar.js   wasm/xroar.js
          cp emcc_workflow/xroar-1.12.1-pristine/src/xroar.wasm wasm/xroar.wasm

      - name: Verify output
        run: |
          ls -la wasm/xroar.js wasm/xroar.wasm
          test -s wasm/xroar.wasm && echo "xroar.wasm OK"
          test -s wasm/xroar.js   && echo "xroar.js OK"

      - name: Write build report
        if: always()
        run: |
          echo "# XRoar stock WASM Build Report" > wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "**Built:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "**Source:** emcc_workflow/xroar-1.12.1-pristine/ -- genuinely untouched upstream, refreshed manually only when a real new release drops (see https://www.6809.org.uk/xroar/dl/)" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "**Build flags:** CFLAGS/LDFLAGS = -O3 -flto (per Ciaran's own XRoar Online build recommendation)" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "**WASM size:** $(wc -c < wasm/xroar.wasm 2>/dev/null || echo 'build failed') bytes" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "This replaces the live wasm/xroar.js and wasm/xroar.wasm used by" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "index.html and index_new.html. Pure upstream, no custom modifications" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "at all -- the debug/register/breakpoint/memory-access functions live" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "only in the separately-built xroar-custom-patched.js/.wasm, produced" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "by build_xroar_wasm.yml from the patched tree, used only by" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "index_custom.html. This workflow no longer touches those files at all." >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "Also built: wasm/xroar-version.js / xroar-version.wasm -- a tiny," >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "separate, MODULARIZE-d companion program (not part of xroar's own" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "source) that reports the version string from the same config.h" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "this build generated. Reports the bare version (e.g. \"XRoar 1.12.1\")" >> wasm/XROAR_STOCK_BUILD_REPORT.md
          echo "with no build tag, since this really is unmodified upstream." >> wasm/XROAR_STOCK_BUILD_REPORT.md

      - name: Commit WASM output
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          echo "=== git status before add ==="
          git status --short | head -30

          git add wasm/xroar.js wasm/xroar.wasm wasm/xroar-version.js wasm/xroar-version.wasm wasm/XROAR_STOCK_BUILD_REPORT.md

          if git diff --staged --quiet; then
            echo "Nothing staged -- output identical to what's already committed. Skipping commit/push."
            exit 0
          fi

          git commit -m "build: xroar stock WASM from pure 1.12.1 upstream [ci skip]"

          echo "=== attempting git pull --rebase --autostash origin main ==="
          if ! git pull --rebase --autostash origin main; then
            echo "PULL --REBASE FAILED. git status follows:"
            git status
            git rebase --abort 2>/dev/null || true
            exit 1
          fi

          echo "=== attempting git push ==="
          if ! git push; then
            echo "PUSH FAILED. git status and remote follow:"
            git status
            git remote -v
            exit 1
          fi

          echo "Push succeeded."
